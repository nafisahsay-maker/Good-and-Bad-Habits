<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Good or Bad Habit?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap">
<style>
:root{--bg:#ffe3c2;--card:#fff8ef;--ink:#2b2a4c;--muted:#6a5f78;--accent:#ff7a45;--ok:#1f9d6b;--okbg:#d5f3e5;--bad:#d6334f;--badbg:#fbdbe0;--line:#f0c99c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#241f3a;--card:#322b4f;--ink:#fff1e0;--muted:#c3b5d6;--accent:#ff9466;--ok:#5fe0ae;--okbg:#1d4a3d;--bad:#ff8aa0;--badbg:#5a2638;--line:#4c4372}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-size:18px;line-height:1.5;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
a.back{color:var(--muted);font-weight:700;text-decoration:none;font-size:15px}
h1{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:clamp(30px,7vw,44px);line-height:1.05;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-weight:700;font-size:15px;margin-bottom:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px 20px}
.part{font-weight:800;color:var(--accent);margin:0 0 6px}
.hint{color:var(--muted);font-size:16px;margin:0 0 14px}
.sentence{font-family:"Baloo 2",system-ui,sans-serif;font-weight:600;font-size:clamp(22px,5.2vw,28px);line-height:1.35;margin:0 0 20px}
.blank{display:inline-block;min-width:110px;border-bottom:4px dashed var(--accent);text-align:center;padding:0 8px;color:var(--accent)}
.blank.ok{border-bottom:4px solid var(--ok);color:var(--ok)}
.blank.bad{border-bottom:4px solid var(--bad);color:var(--bad)}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{font:inherit;font-weight:700;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opts.two .opt{text-align:center}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;padding:14px 16px;border-radius:14px;font-weight:700}
.fb.ok{background:var(--okbg)}
.fb.bad{background:var(--badbg)}
.fb small{display:block;font-weight:500;color:var(--muted);margin-top:2px}
.btn{font:inherit;font-weight:800;margin-top:16px;padding:14px 22px;border:0;border-radius:99px;background:var(--accent);color:#2b1608;cursor:pointer}
.big{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:56px;line-height:1;margin:4px 0}
ul.miss{padding-left:20px;margin:10px 0 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<a class="back" href="index.html">Back to home</a>
<h1>Good or Bad Habit?</h1>
<p class="sub">Decide whether each habit is good or bad.</p>

<section id="play">
  <div class="bar"><i id="fill"></i></div>
  <div class="meta"><span id="count"></span><span id="score"></span></div>
  <div class="card">
    <p class="part" id="part"></p>
    <p class="hint" id="hint"></p>
    <p class="sentence" id="sentence"></p>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" hidden></div>
    <button class="btn" id="next" hidden></button>
  </div>
</section>

<section id="end" hidden>
  <div class="card">
    <p class="sub" style="margin:0">Your score</p>
    <p class="big" id="final"></p>
    <p id="msg" style="font-weight:700"></p>
    <div id="review"></div>
    <button class="btn" id="again">Play again</button>
  </div>
</section>
</main>

<script>
var SORT=[
{t:"Disciplined",a:"Good habit",h:"Disciplined = mampu mengendalikan diri dan mengikuti aturan yang ketat."},
{t:"Working out",a:"Good habit",h:"Working out termasuk healthy habits, yaitu tindakan untuk menjaga kesehatan."},
{t:"Sticking to it",a:"Good habit",h:"Stick to it = tetap melakukan sesuatu walaupun sulit."},
{t:"Being an optimist",a:"Good habit",h:"Optimist = orang yang cenderung berpandangan positif."},
{t:"Eating balanced meals",a:"Good habit",h:"Makan seimbang termasuk healthy habits."},
{t:"Procrastinating",a:"Bad habit",h:"Procrastinate (put off) = menunda pekerjaan ke waktu yang lebih lambat."},
{t:"Chain smoking",a:"Bad habit",h:"Chain smoker = orang yang merokok terus-menerus."},
{t:"Interrupting",a:"Bad habit",h:"Interrupting = memotong pembicaraan saat orang lain masih bicara."},
{t:"Littering",a:"Bad habit",h:"Litterbug = orang yang suka membuang sampah sembarangan."},
{t:"Leaving a mess",a:"Bad habit",h:"Leaving a mess = tidak mencuci piring, membuang sampah, atau merapikan baju."}
];
var USED=[
{s:"He ___ get into trouble all the time when he was a teenager.",a:"used to",o:["is used to","use to"],h:"Kebiasaan masa lalu yang sudah tidak dilakukan: used to + verb dasar."},
{s:"I work the night shift, so I am used to ___ up all night.",a:"staying",o:["stay","stayed"],h:"Be used to diikuti verb-ing (gerund) atau noun."},
{s:"They ___ tease me for the way I spoke in school.",a:"used to",o:["are used to","were used to"],h:"Kebiasaan di masa lalu: used to + verb dasar (tease)."},
{s:"She is a workaholic, so she ___ a nonstop schedule.",a:"is used to",o:["used to","use to"],h:"Sudah terbiasa sekarang: subject + be + used to + noun."},
{s:"Lany ___ chain-smoke, but she quit last year.",a:"used to",o:["is used to","is use to"],h:"Sudah berhenti sekarang, jadi kebiasaan masa lalu: used to + verb dasar."},
{s:"We ___ the noise of the city, so the loud neighbors don’t bother us.",a:"are used to",o:["used to","are use to"],h:"Sudah terbiasa sekarang: be used to + noun."},
{s:"I used to be a morning monster, but now I am used to ___ up with the sun.",a:"getting",o:["get","got"],h:"Be used to + verb-ing."},
{s:"James is used to ___ his bed every morning, so his room is always neat.",a:"making",o:["make","made"],h:"Be used to + verb-ing."}
];
function $(i){return document.getElementById(i)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var steps,idx,score,missed,locked;
function start(){
  steps=shuffle(SORT).map(function(x){return{k:"sort",t:x.t,a:x.a,h:x.h}});
  idx=0;score=0;missed=[];$("end").hidden=true;$("play").hidden=false;show();
}
function show(){
  var q=steps[idx];locked=false;
  $("count").textContent="Question "+(idx+1)+" of "+steps.length;
  $("score").textContent="Score: "+score;
  $("fill").style.width=(idx/steps.length*100)+"%";
  var box=$("opts");box.innerHTML="";
  var opts;
  if(q.k==="sort"){
    $("part").textContent="Good or bad?";
    $("hint").textContent="Is this a good habit or a bad habit?";
    $("sentence").textContent=q.t;
    box.className="opts two";opts=["Good habit","Bad habit"];
  }else{
    $("part").textContent="Used to or be used to?";
    $("hint").textContent="Choose the correct form.";
    var p=q.s.split("___");
    $("sentence").innerHTML=p[0]+'<span class="blank" id="blank">&nbsp;</span>'+p[1];
    box.className="opts";opts=shuffle([q.a].concat(q.o));
  }
  opts.forEach(function(t){
    var b=document.createElement("button");b.className="opt";b.type="button";b.textContent=t;
    b.onclick=function(){pick(b,t)};box.appendChild(b)});
  $("fb").hidden=true;$("next").hidden=true;
}
function pick(btn,t){
  if(locked)return;locked=true;
  var q=steps[idx],ok=(t===q.a);
  if(q.k==="mc"){var bl=$("blank");bl.textContent=q.a;bl.className="blank "+(ok?"ok":"bad")}
  Array.prototype.forEach.call($("opts").children,function(b){
    b.disabled=true;if(b.textContent===q.a)b.classList.add("ok")});
  if(!ok){btn.classList.add("bad");missed.push(q)}else score++;
  $("score").textContent="Score: "+score;
  var fb=$("fb");fb.hidden=false;fb.className="fb "+(ok?"ok":"bad");
  fb.innerHTML=(ok?"Correct!":"Not quite. The answer is “"+q.a+"”.")+"<small>"+q.h+"</small>";
  var n=$("next");n.hidden=false;n.textContent=(idx===steps.length-1)?"See my score":"Next question";n.focus();
}
$("next").onclick=function(){idx++;if(idx>=steps.length)finish();else show()};
function finish(){
  $("play").hidden=true;$("end").hidden=false;
  $("final").textContent=score+" / "+steps.length;
  var p=score/steps.length;
  $("msg").textContent=p===1?"Perfect! You know your habits and your grammar.":p>=0.7?"Great job! Just a few items to review.":p>=0.4?"Good start. Review the items below and try again.":"Keep practicing. Read the habit vocabulary once more, then play again.";
  var r=$("review");r.innerHTML="";
  if(missed.length){
    var h='<p style="margin:14px 0 0;font-weight:800">Review these:</p><ul class="miss">';
    missed.forEach(function(q){h+="<li><b>"+(q.k==="sort"?q.t:q.s.replace("___",q.a))+"</b>: "+q.h+"</li>"});
    r.innerHTML=h+"</ul>";
  }
}
$("again").onclick=start;
start();
</script>
</body>
</html>
