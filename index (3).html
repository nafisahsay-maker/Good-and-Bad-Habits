<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good and Bad Habits</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap">
<style>
:root{--bg:#ffe3c2;--card:#fff8ef;--ink:#2b2a4c;--muted:#6a5f78;--accent:#ff7a45;--line:#f0c99c}
@media (prefers-color-scheme:dark){:root{--bg:#241f3a;--card:#322b4f;--ink:#fff1e0;--muted:#c3b5d6;--accent:#ff9466;--line:#4c4372}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-size:18px;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:32px 16px 48px}
h1{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:clamp(32px,8vw,48px);line-height:1.05;margin:0 0 8px}
p.lead{color:var(--muted);margin:0 0 24px}
.grid{display:grid;gap:14px}
.card{display:block;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;text-decoration:none;color:inherit}
a.card:hover{border-color:var(--accent)}
a.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card h2{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:24px;margin:0 0 4px}
.card p{margin:0;color:var(--muted)}
.card.soon{opacity:.6}
</style>
</head>
<body>
<main>
  <h1>Good and Bad Habits</h1>
  <p class="lead">Pick a game and start playing.</p>
  <div class="grid">
    <a class="card" href="habits-sort.html">
      <h2>Good or Bad Habit?</h2>
      <p>Sort each habit into the right group.</p>
    </a>
    <a class="card" href="used-to.html">
      <h2>Used to vs Be Used to</h2>
      <p>Fill in the blank with the correct form.</p>
    </a>
  </div>
</main>
</body>
</html>
